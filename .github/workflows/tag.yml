name: Version Bump

on:
  pull_request:
    branches:
      - main*
    types:
      - closed

jobs:
  bump-version:
    runs-on: ubuntu-latest

    steps:
      - name: Check PR Title and Determine Version Bump
        id: check-pr-title
        if: github.event.pull_request.merged == true
        run: |
          PR_TITLE=$(jq -r .pull_request.title "$GITHUB_EVENT_PATH")
          echo "PR Title: $PR_TITLE"
          lowercase_title=$(echo "$PR_TITLE" | tr '[:upper:]' '[:lower:]')
          if [[ $lowercase_title =~ (patch|minor|major) ]]; then
            echo "Version bump keyword found: ${BASH_REMATCH[0]}"
            echo "bump_version=${BASH_REMATCH[0]}" >> $GITHUB_OUTPUT
          else
            echo "No version bump keyword (patch, minor, or major) found in the PR title."
            exit 1
          fi
        shell: bash

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies for version bumping
        run: |
          uv add --dev packaging tomli-w

      - name: Bump Version and tag
        if: steps.check-pr-title.outputs.bump_version
        run: |
          VERSION_BUMP="${{ steps.check-pr-title.outputs.bump_version }}"
          
          # Read current version and bump it
          python -c "
          import tomllib
          import tomli_w
          from packaging.version import Version
          
          # Read current pyproject.toml
          with open('pyproject.toml', 'rb') as f:
              data = tomllib.load(f)
          
          current_version = Version(data['project']['version'])
          
          # Determine new version based on bump type
          bump_type = '$VERSION_BUMP'
          if bump_type == 'major':
              new_version = Version(f'{current_version.major + 1}.0.0')
          elif bump_type == 'minor':
              new_version = Version(f'{current_version.major}.{current_version.minor + 1}.0')
          elif bump_type == 'patch':
              new_version = Version(f'{current_version.major}.{current_version.minor}.{current_version.micro + 1}')
          
          # Update version in data
          data['project']['version'] = str(new_version)
          
          # Write back to pyproject.toml
          with open('pyproject.toml', 'wb') as f:
              tomli_w.dump(data, f)
          
          print(f'Bumped version from {current_version} to {new_version}')
          "
          
          RELEASE_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          git config --global user.email "clement.come98@gmail.com"
          git config --global user.name "CI/CD"
          git commit -m "Bump version to $RELEASE_VERSION" pyproject.toml
          git push -f origin HEAD:${{ github.base_ref }}
          git tag -a "v$RELEASE_VERSION" -m "Version $RELEASE_VERSION"
          git push -f origin "v$RELEASE_VERSION"
